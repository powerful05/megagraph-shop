spring:
  servlet:
    session:
      cookie:
        secure: false
  datasource:
    url: jdbc:h2:mem:megagraph-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate

app:
  security:
    legacy-basic-enabled: true
    legacy-merchant-context-enabled: true
    csrf-enabled: false
    login-rate-limit-enabled: false
  dev-seed:
    enabled: true
  media:
    upload-dir: ${java.io.tmpdir}/megagraph-shop-tests
  payments:
    mock:
      callback-secret: test-only-megagraph-mock-callback-secret
      command-scan-ms: 3600000
      command-initial-delay-ms: 3600000
