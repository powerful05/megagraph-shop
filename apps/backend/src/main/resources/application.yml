spring:
  application:
    name: megagraph-shop-backend
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  session:
    store-type: jdbc
    timeout: 8h
    jdbc:
      initialize-schema: never

server:
  port: 8080
  error:
    include-message: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${APP_SESSION_COOKIE_SECURE:true}

app:
  security:
    legacy-basic-enabled: false
    legacy-merchant-context-enabled: false
  media:
    upload-dir: ./var/uploads
    max-bytes: 10485760
    allowed-content-types: image/jpeg,image/png,image/webp
  dev-seed:
    enabled: false
  orders:
    payment-window: PT15M
    expiry-scan-ms: 60000
