# Local-only expanded fixtures use a separate database, media directory and session cookie.
spring:
  datasource:
    url: jdbc:h2:file:./var/db/guide-expanded;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
server:
  servlet:
    session:
      cookie:
        name: GUIDE_EXPANDED_SESSION
app:
  test-supply:
    expanded: true
  media:
    upload-dir: ./var/guide-expanded/uploads
